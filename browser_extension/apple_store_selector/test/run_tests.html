<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>取货门店助手 · 本地测试</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 16px; }
  pre { background: #f5f5f7; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  iframe { width: 420px; height: 70px; border: 1px solid #ddd; margin: 3px 0; }
</style>
</head>
<body>
<h3>取货门店助手 · 本地测试（不联网，不访问 Apple）</h3>
<pre id="summary">running…</pre>
<div id="frames"></div>

<script>
/*
 * 每个场景开一个 iframe 载入 mock_pickup_page.html，等 content.js 汇报结果，然后断言。
 * 断言内容：选中了哪家门店、点击了哪些元素及顺序、触发器点了几次、fragment 是否被清掉。
 */
var BASE = "mock_pickup_page.html";

// 两轮：同一组场景分别用权威源和 Safari 扩展包里的副本各跑一遍，最后比对结果是否一致
var SAFARI_SRC = "/safari/build/DuoMonitorStoreSelector.app/Contents/PlugIns/" +
  "DuoMonitorStoreSelectorExtension.appex/Contents/Resources/";
var PASSES = [
  { label: "Chrome/Edge 权威源", src: "/apple_store_selector/" },
  { label: "Safari 扩展包副本", src: SAFARI_SRC }
];

var SCENARIOS = [
  // ---- 门店列表已经在页面上（v2.7 行为，必须不回归） ----
  { name: "1 单门店 R484",
    q: "stores=R484:ok", frag: "R484",
    expect: { status: "selected", store: "R484", triggerClicks: 0 } },

  { name: "2 多门店 R761→R793→R484 全可选，选最高优先",
    q: "stores=R484:ok,R793:ok,R761:ok", frag: "R761,R793,R484",
    expect: { status: "selected", store: "R761" } },

  { name: "3 最高优先门店不在列表里，自动选第二家",
    q: "stores=R793:ok,R484:ok", frag: "R761,R793,R484",
    expect: { status: "selected", store: "R793" } },

  { name: "4 最高优先门店 disabled，自动选第二家",
    q: "stores=R761:off,R793:ok,R484:ok", frag: "R761,R793,R484",
    expect: { status: "selected", store: "R793" } },

  { name: "5 最高优先门店 aria-disabled，自动选第二家",
    q: "stores=R761:aria,R793:ok", frag: "R761,R793",
    expect: { status: "selected", store: "R793" } },

  { name: "6 前两家都不可用，选第三家 R484",
    q: "stores=R761:off,R793:aria,R484:ok", frag: "R761,R793,R484",
    expect: { status: "selected", store: "R484" } },

  { name: "7 候选全都不在列表里 → 安全退出，零点击",
    q: "stores=R577:ok,R639:ok", frag: "R761,R793,R484",
    expect: { status: "failed", reason: "no_selectable_candidate", clicks: 0 } },

  { name: "8 候选全部 disabled → 安全退出，零点击",
    q: "stores=R761:off,R793:off", frag: "R761,R793",
    expect: { status: "failed", reason: "no_selectable_candidate", clicks: 0 } },

  { name: "9 无触发器且门店列表不出现 → 超时退出，零点击",
    q: "", frag: "R484", timeout: 700,
    expect: { status: "failed", reason: "panel_timeout", clicks: 0 } },

  { name: "10 没有 fragment（auto_select_store=false）→ 完全不动作",
    q: "stores=R484:ok&trigger=ok&gate=trigger", frag: null,
    expect: { status: "inactive", clicks: 0, hash: "" } },

  { name: "11 候选已经是选中状态 → 认可结果且不重复点击",
    q: "stores=R761:checked,R793:ok", frag: "R761,R793",
    expect: { status: "selected", store: "R761", clicks: 0 } },

  { name: "12 fragment 里的其它键保留，只清掉 duomonitor-stores",
    q: "stores=R484:ok", frag: "R484", rawFrag: "a=b&duomonitor-stores=R484",
    expect: { status: "selected", store: "R484", hash: "#a=b" } },

  { name: "13 非法 token 被丢弃，只认合法门店号",
    q: "stores=R793:ok,R484:ok", frag: null,
    rawFrag: "duomonitor-stores=" + encodeURIComponent("<script>,DROP TABLE,,R484,token=abc,R484,R793"),
    expect: { status: "selected", store: "R484", candidates: ["R484", "R793"] } },

  // ---- v2.8 新增：自动点“查看供货情况” ----
  { name: "14 需要先点“查看供货情况”才出门店列表 → 自动点开并选中 R761",
    q: "stores=R484:ok,R793:ok,R761:ok&trigger=ok&gate=trigger", frag: "R761,R793,R484",
    expect: { status: "selected", store: "R761", triggerClicks: 1,
              clickSeq: ["#pickup-trigger", "[value=R761]"] } },

  { name: "15 门店列表已经在页面上 → 不去点触发器",
    q: "stores=R484:ok&trigger=ok&gate=open", frag: "R484",
    expect: { status: "selected", store: "R484", triggerClicks: 0, clicks: 1,
              clickSeq: ["[value=R484]"] } },

  { name: "16 触发器是默认 submit 按钮（点了可能提交表单）→ 拒绝点击，零点击",
    q: "stores=R484:ok&trigger=submit&gate=trigger", frag: "R484", timeout: 700,
    expect: { status: "failed", reason: "panel_timeout", clicks: 0, triggerClicks: 0 } },

  { name: "17 触发器文字是“继续”（红线词）→ 拒绝点击，零点击",
    q: "stores=R484:ok&trigger=badtext&gate=trigger", frag: "R484", timeout: 700,
    expect: { status: "failed", reason: "panel_timeout", clicks: 0, triggerClicks: 0 } },

  { name: "18 触发器是会跳走的链接 href=/shop/bag → 拒绝点击，零点击",
    q: "stores=R484:ok&trigger=navlink&gate=trigger", frag: "R484", timeout: 700,
    expect: { status: "failed", reason: "panel_timeout", clicks: 0, triggerClicks: 0 } },

  { name: "19 触发器是锚点 a href=# → 允许，点开后选中门店",
    q: "stores=R793:ok,R484:ok&trigger=link&gate=trigger", frag: "R484,R793",
    expect: { status: "selected", store: "R484", triggerClicks: 1,
              clickSeq: ["#pickup-trigger", "[value=R484]"] } },

  { name: "20 点开了但门店列表始终不出现 → 触发器只点 1 次，超时退出",
    q: "trigger=ok&gate=trigger", frag: "R484", timeout: 900,
    expect: { status: "failed", reason: "panel_timeout", clicks: 1, triggerClicks: 1,
              clickSeq: ["#pickup-trigger"] } },

  { name: "21 AUTO_OPEN_PICKUP_PANEL=false → 不点触发器，只被动等",
    q: "stores=R484:ok&trigger=ok&gate=trigger&autoopen=0", frag: "R484", timeout: 700,
    expect: { status: "failed", reason: "panel_timeout", clicks: 0, triggerClicks: 0 } }
];

var results = [];
var pending = {};

window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.type !== "duomonitor-test") { return; }
  if (pending[d.name]) { pending[d.name](d); delete pending[d.name]; }
});

function runOne(sc, idx, pass, passIdx) {
  return new Promise(function (resolve) {
    var name = "p" + passIdx + "s" + idx;
    var frag = sc.rawFrag ? ("#" + sc.rawFrag) : (sc.frag ? "#duomonitor-stores=" + sc.frag : "");
    // 生产用的是 15000ms；这里压到 2500ms 只为让测试跑得快，仍远大于渲染门店列表所需时间
    var url = BASE + "?name=" + name + "&src=" + encodeURIComponent(pass.src) +
      "&timeout=" + (sc.timeout || 2500) +
      "&settle=300&poll=40&delay=120&retry=150&initdelay=250" + (sc.q ? "&" + sc.q : "") + frag;
    var done = false;
    pending[name] = function (msg) { done = true; resolve(check(sc, msg)); };
    var f = document.createElement("iframe");
    f.src = url;
    document.getElementById("frames").appendChild(f);
    setTimeout(function () {
      if (!done) { delete pending[name]; resolve({ name: sc.name, ok: false, why: "超时未收到结果（content.js 没有结束）" }); }
    }, 6000);
  });
}

function isRadioClick(c) { return c.indexOf("[name=store-") >= 0; }
function isTriggerClick(c) { return c.indexOf("#pickup-trigger") >= 0; }

function check(sc, msg) {
  var e = sc.expect;
  var o = msg.outcome || {};
  var why = [];
  if (o.status !== e.status) { why.push("status=" + o.status + " 期望 " + e.status); }
  if (e.store && o.store !== e.store) { why.push("store=" + o.store + " 期望 " + e.store); }
  if (e.reason && o.reason !== e.reason) { why.push("reason=" + o.reason + " 期望 " + e.reason); }
  if (typeof e.clicks === "number" && msg.clicks.length !== e.clicks) {
    why.push("点击 " + msg.clicks.length + " 次 期望 " + e.clicks + " 次: " + msg.clicks.join("|"));
  }
  if (typeof e.triggerClicks === "number" && (o.triggerClicks || 0) !== e.triggerClicks) {
    why.push("triggerClicks=" + (o.triggerClicks || 0) + " 期望 " + e.triggerClicks);
  }
  if (e.clickSeq) {
    if (msg.clicks.length !== e.clickSeq.length) {
      why.push("点击序列长度 " + msg.clicks.length + " 期望 " + e.clickSeq.length + ": " + msg.clicks.join("|"));
    } else {
      for (var i = 0; i < e.clickSeq.length; i++) {
        if (msg.clicks[i].indexOf(e.clickSeq[i]) < 0) {
          why.push("第 " + (i + 1) + " 次点击 " + msg.clicks[i] + " 不含 " + e.clickSeq[i]);
        }
      }
    }
  }
  if (typeof e.hash === "string" && msg.hash !== e.hash) { why.push("hash=" + JSON.stringify(msg.hash) + " 期望 " + JSON.stringify(e.hash)); }
  if (e.candidates && String(o.candidates) !== String(e.candidates)) {
    why.push("candidates=" + String(o.candidates) + " 期望 " + String(e.candidates));
  }

  // ---- 全场景硬性红线 ----
  msg.clicks.forEach(function (c) {
    // 绝不能点“继续”或“加入购物袋”
    if (c.indexOf("#continue") >= 0 || c.indexOf("#atb") >= 0) { why.push("点到了禁止元素 " + c); }
    // 只允许点两类元素：供货情况触发器、门店 radio
    if (!isRadioClick(c) && !isTriggerClick(c)) { why.push("点到了白名单以外的元素 " + c); }
  });
  // 任何情况下最多只点一个门店 radio
  if (msg.clicks.filter(isRadioClick).length > 1) {
    why.push("点了多个门店 radio: " + msg.clicks.join("|"));
  }
  // 触发器最多点 3 次，且失败场景不得点到 radio
  if (msg.clicks.filter(isTriggerClick).length > 3) { why.push("触发器点击超过 3 次"); }
  if (o.status !== "selected" && msg.clicks.filter(isRadioClick).length > 0) {
    why.push("未选中却点了门店 radio: " + msg.clicks.join("|"));
  }
  // 除了 inactive 场景，fragment 必须已经被清掉
  if (o.status !== "inactive" && msg.hash.indexOf("duomonitor-stores") >= 0) {
    why.push("fragment 没被清除: " + msg.hash);
  }
  if (o.status === "core_missing") {
    why = ["共享核心没能从 " + msg.src + " 加载（Safari 扩展包可能还没构建）"];
  }
  return { name: sc.name, ok: why.length === 0, why: why.join("; "),
           clicks: msg.clicks.join(" , ") || "(无)",
           status: o.status, store: o.store || "", core: o.core || "" };
}

// 预热：先空跑一次，把脚本和 mock 页面加载进缓存，避免第一个场景受冷启动影响
function warmup(src) {
  return new Promise(function (resolve) {
    var key = "warm" + encodeURIComponent(src);
    pending[key] = function () { resolve(); };
    var f = document.createElement("iframe");
    f.src = BASE + "?name=" + key + "&src=" + encodeURIComponent(src) +
      "&timeout=2500&settle=300&poll=40&delay=60&initdelay=250&stores=R484:ok#duomonitor-stores=R484";
    document.getElementById("frames").appendChild(f);
    setTimeout(function () { delete pending[key]; resolve(); }, 4000);
  });
}

(async function () {
  var lines = [];
  var totalPass = 0, totalRun = 0;
  var byPass = [];

  for (var p = 0; p < PASSES.length; p++) {
    var pass = PASSES[p];
    await warmup(pass.src);
    var rows = [];
    for (var i = 0; i < SCENARIOS.length; i++) {
      rows.push(await runOne(SCENARIOS[i], i, pass, p));
    }
    byPass.push(rows);
    var n = rows.filter(function (r) { return r.ok; }).length;
    totalPass += n; totalRun += rows.length;
    lines.push("===== " + pass.label + "  (" + n + "/" + rows.length + ") =====");
    lines.push("      " + pass.src);
    rows.forEach(function (r) {
      lines.push((r.ok ? "PASS  " : "FAIL  ") + r.name + (r.ok ? "  [点击: " + r.clicks + "]" : "  → " + r.why));
    });
    lines.push("");
  }

  // 一致性比对：同一个候选列表，两边必须得出同样的状态和同样的最终门店
  var parityFail = 0;
  lines.push("===== 两版结果一致性比对 =====");
  for (var k = 0; k < SCENARIOS.length; k++) {
    var a = byPass[0][k], b = byPass[1][k];
    var same = a && b && a.status === b.status && (a.store || "") === (b.store || "");
    if (!same) {
      parityFail += 1;
      lines.push("FAIL  " + SCENARIOS[k].name + "  → Chrome " + (a && a.status) + "/" + (a && a.store) +
        " vs Safari " + (b && b.status) + "/" + (b && b.store));
    }
  }
  var coreA = (byPass[0][0] || {}).core || "?";
  var coreB = (byPass[1][0] || {}).core || "?";
  if (!parityFail) {
    lines.push("PASS  " + SCENARIOS.length + " 个场景两版结果完全一致（核心版本 " + coreA + " / " + coreB + "）");
  }
  lines.push("");
  lines.push("场景总计 " + totalPass + "/" + totalRun + " 通过，一致性比对 " +
    (SCENARIOS.length - parityFail) + "/" + SCENARIOS.length + " 一致");

  document.getElementById("summary").textContent = lines.join("\n");
  var allGood = (totalPass === totalRun) && (parityFail === 0);
  document.title = (allGood ? "ALL PASS " : "FAILED ") + totalPass + "/" + totalRun +
    " parity " + (SCENARIOS.length - parityFail) + "/" + SCENARIOS.length;
})();
</script>
</body>
</html>
